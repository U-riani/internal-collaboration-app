name: Android FCM backend checks
on:
  push:
    branches: [prod]
    paths:
      - 'apps/api/**'
      - '.github/workflows/android-fcm-api.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix apps/api
      - name: Check all API JavaScript and Prisma models
        run: npm --prefix apps/api run check
      - name: Generate Prisma client for Android push models
        run: npm --prefix apps/api run db:generate
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
