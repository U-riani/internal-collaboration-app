# Optional overlay for existing installations that already use a MinIO volume.
# Set STORAGE_DRIVER=s3 in the existing .env before using this overlay.
services:
  minio:
    image: ${LEGACY_MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    depends_on:
      minio:
        condition: service_healthy
volumes:
  minio_data:
